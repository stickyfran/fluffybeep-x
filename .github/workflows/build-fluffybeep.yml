name: FluffyBeep X - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ fluffybeep ]
  pull_request:
    branches: [ fluffybeep ]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  build:
    name: Build FluffyBeep X APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.ref == 'refs/heads/fluffybeep' && format('build-fluffybeep-{0}', github.sha) || format('build-pr-{0}', github.ref) }}
      cancel-in-progress: true
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - name: Use JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/fluffybeep' }}

      - name: Assemble debug APK (FDroid flavor - arm64-v8a only)
        run: ./gradlew :app:assembleFDroidDebug -PtargetAbi=arm64-v8a $CI_GRADLE_ARG_PROPERTIES

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fluffybeep-x-arm64-debug
          path: app/build/outputs/apk/fdroid/debug/*-arm64-v8a-debug.apk
          retention-days: 14

      - name: Prepare APK for Release
        if: github.ref == 'refs/heads/fluffybeep' && github.event_name != 'pull_request'
        run: |
          APK_FILE=$(ls app/build/outputs/apk/fdroid/debug/*-arm64-v8a-debug.apk | head -n 1)
          cp "$APK_FILE" fluffybeep-x-arm64-v8a-debug.apk

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/fluffybeep' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@c062e08bd53281573082269a27e3036e782a2786 # v2.0.8
        with:
          tag_name: latest
          name: FluffyBeep X (Latest Build)
          body: |
            Build automático de FluffyBeep X (arm64-v8a) generado desde commit `${{ github.sha }}`.
          draft: false
          prerelease: true
          make_latest: true
          files: |
            fluffybeep-x-arm64-v8a-debug.apk
